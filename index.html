<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMAR GABER - RoboEyes</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #0b0f19; color: #f8fafc; padding: 15px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 420px; background: #131b2e; border-radius: 24px; padding: 22px; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4); border: 1px solid #1e293b; }
        .author-tag { text-align: center; color: #38bdf8; font-size: 14px; font-weight: bold; margin-bottom: 18px; letter-spacing: 1.5px; }
        
        .mode-switch { display: grid; grid-template-columns: repeat(5, 1fr); gap: 5px; margin-bottom: 15px; }
        .btn-mode { padding: 8px 2px; border: 1px solid #334155; background: #0f172a; color: #94a3b8; border-radius: 10px; font-weight: bold; font-size: 11px; cursor: pointer; transition: 0.2s; text-align: center; }
        .btn-mode.active { background: #0284c7; color: #ffffff; border-color: #38bdf8; box-shadow: 0 0 12px rgba(2, 132, 199, 0.4); }

        .robot-preview { background: #000000; border: 2px solid #38bdf8; border-radius: 16px; height: 135px; display: flex; justify-content: center; align-items: center; gap: 25px; margin-bottom: 18px; position: relative; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); overflow: hidden; padding: 5px; }
        
        /* عيون دائرية مفرغة وبؤبؤ مطابق لتصميم الميدالية */
        .eye-container { position: relative; display: flex; flex-direction: column; align-items: center; transition: transform 0.15s ease; }
        .brow { width: 35px; height: 5px; background: #38bdf8; border-radius: 2px; margin-bottom: 5px; transition: all 0.2s ease; box-shadow: 0 0 6px #38bdf8; }
        .eye-circle { width: 40px; height: 40px; border: 2.5px solid #38bdf8; border-radius: 50%; display: flex; justify-content: center; align-items: center; box-shadow: 0 0 10px #38bdf8; transition: all 0.15s ease; position: relative; }
        .pupil { width: 12px; height: 12px; background: #38bdf8; border-radius: 50%; box-shadow: 0 0 6px #38bdf8; }
        
        .smile-mouth { position: absolute; bottom: 22px; width: 28px; height: 10px; border: 3px solid #38bdf8; border-top: none; border-radius: 0 0 15px 15px; display: none; box-shadow: 0 0 8px #38bdf8; }
        
        .dead-eye { border: none !important; background: transparent !important; box-shadow: none !important; position: relative; }
        .dead-eye::before, .dead-eye::after { content: ""; position: absolute; top: 18px; left: 2px; width: 36px; height: 4px; background: #38bdf8; border-radius: 2px; box-shadow: 0 0 8px #38bdf8; }
        .dead-eye::before { transform: rotate(45deg); }
        .dead-eye::after { transform: rotate(-45deg); }

        .heart-eye { border: none !important; width: 40px !important; height: 40px !important; background: transparent !important; position: relative; box-shadow: none !important; }
        .heart-eye::before, .heart-eye::after { content: ""; position: absolute; top: 2px; width: 20px; height: 30px; background: #38bdf8; border-radius: 15px 15px 0 0; box-shadow: 0 0 10px #38bdf8; }
        .heart-eye::before { left: 20px; transform: rotate(-45deg); transform-origin: 0 100%; }
        .heart-eye::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

        .preview-screen-box { display: none; flex-direction: column; align-items: center; justify-content: center; width: 100%; text-align: center; height: 100%; }
        .clock-main { font-size: 32px; font-weight: 800; color: #38bdf8; text-shadow: 0 0 10px #38bdf8; font-family: monospace; }
        
        .text-scroll-container { width: 100%; overflow: hidden; white-space: nowrap; position: relative; }
        .text-main { display: inline-block; font-size: 24px; font-weight: 700; color: #38bdf8; text-shadow: 0 0 10px #38bdf8; font-family: monospace; }
        .anim-scroll { animation: webScroll 6s linear infinite; }
        .anim-static { animation: none; transform: translateX(0); }
        .anim-slide-down { animation: slideDown 1s ease forwards; }

        @keyframes webScroll { 0% { transform: translateX(150px); } 100% { transform: translateX(-200px); } }
        @keyframes slideDown { 0% { transform: translateY(-50px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }

        .xo-container { display: flex; flex-direction: column; align-items: center; justify-content: center; width: 100%; height: 100%; }
        .xo-header { display: flex; justify-content: space-between; width: 100%; padding: 0 10px 4px 10px; font-size: 12px; color: #38bdf8; font-weight: bold; align-items: center; }
        .xo-board { display: grid; grid-template-columns: repeat(3, 34px); gap: 3px; }
        .xo-cell { width: 34px; height: 34px; background: #0f172a; border: 1.5px solid #38bdf8; border-radius: 6px; color: #38bdf8; font-size: 18px; font-weight: bold; cursor: pointer; display: flex; align-items: center; justify-content: center; text-shadow: 0 0 6px #38bdf8; }
        .xo-cell:hover { background: #1e293b; }
        
        .piece-select { display: flex; gap: 5px; align-items: center; }
        .btn-piece { background: #1e293b; color: #38bdf8; border: 1.5px solid #38bdf8; padding: 2px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; font-weight: bold; }
        .btn-piece.active { background: #0284c7; color: white; }

        .status-box { background: #0f172a; padding: 10px 15px; border-radius: 12px; font-size: 13px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #1e293b; }
        .btn { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 15px; font-weight: bold; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        .btn-connect { background-color: #0284c7; color: white; }
        .btn-connect.connected { background-color: #16a34a; }
        .btn-sync { background-color: #7c3aed; color: white; }
        .btn-sync:disabled { background-color: #334155; color: #64748b; cursor: not-allowed; }
        
        .section-title { font-size: 13px; color: #38bdf8; margin: 15px 0 8px 0; border-bottom: 1px solid #1e293b; padding-bottom: 4px; font-weight: 600; }
        .time-manual-box { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 10px; }
        select, input[type="text"] { width: 100%; padding: 9px; background: #0f172a; border: 1px solid #334155; color: white; border-radius: 8px; text-align: center; font-size: 14px; }
        
        .mood-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 15px; }
        .btn-mood { background: #1e293b; color: #f8fafc; padding: 9px 4px; border: 1px solid #334155; border-radius: 8px; font-size: 12px; cursor: pointer; transition: 0.15s; font-weight: 600; }
        .btn-mood:hover { background: #334155; border-color: #475569; }
        
        .text-effect-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; margin-bottom: 10px; }
        .log-box { background: #060913; border: 1px solid #1e293b; border-radius: 8px; padding: 8px; font-size: 11px; color: #64748b; height: 55px; overflow-y: auto; text-align: left; }
    </style>
</head>
<body>

    <div class="container">
        <div class="author-tag">BY OMAR GABER</div>

        <div class="mode-switch">
            <button id="modeEyesBtn" class="btn-mode active" onclick="switchDisplayMode('EYES')">Eyes 🤖</button>
            <button id="modeClockBtn" class="btn-mode" onclick="switchDisplayMode('CLOCK')">Clock ⏰</button>
            <button id="modeTextBtn" class="btn-mode" onclick="switchDisplayMode('TEXT')">Text 💬</button>
            <button id="modeMusicBtn" class="btn-mode" onclick="switchDisplayMode('MUSIC')">Music 🎵</button>
            <button id="modeGameBtn" class="btn-mode" onclick="switchDisplayMode('GAME')">XO 🎮</button>
        </div>

        <div class="robot-preview" id="previewBox">
            <div id="eyesWrapper" style="display: flex; gap: 25px; align-items: center;">
                <div class="eye-container" id="leftContainer">
                    <div class="brow" id="leftBrow"></div>
                    <div class="eye-circle" id="leftEye"><div class="pupil" id="leftPupil"></div></div>
                </div>
                <div class="eye-container" id="rightContainer">
                    <div class="brow" id="rightBrow"></div>
                    <div class="eye-circle" id="rightEye"><div class="pupil" id="rightPupil"></div></div>
                </div>
            </div>
            
            <div class="smile-mouth" id="smileMouth"></div>

            <div class="preview-screen-box" id="clockWrapper">
                <div class="clock-main" id="screenClockMain">12:00:00</div>
            </div>

            <div class="preview-screen-box" id="textWrapper">
                <div class="text-scroll-container">
                    <div class="text-main anim-scroll" id="screenTextDisplay">OMAR GABER</div>
                </div>
            </div>

            <div class="preview-screen-box" id="musicWrapper">
                <div style="font-size: 22px; font-weight: bold; color: #38bdf8; text-shadow: 0 0 10px #38bdf8;">🎵 MUSIC MODE 🎶</div>
                <div style="font-size: 12px; color: #94a3b8; margin-top: 5px;">Vibing with OMAR GABER</div>
            </div>

            <div class="preview-screen-box" id="gameWrapper">
                <div class="xo-container">
                    <div class="xo-header">
                        <span id="xoStatusText">Your Turn</span>
                        <div class="piece-select">
                            <button id="btnX" class="btn-piece active" onclick="setPlayerPiece('X')">X</button>
                            <button id="btnO" class="btn-piece" onclick="setPlayerPiece('O')">O</button>
                        </div>
                    </div>
                    <div class="xo-board" id="xoBoard">
                        <div class="xo-cell" onclick="playXOMove(0)"></div>
                        <div class="xo-cell" onclick="playXOMove(1)"></div>
                        <div class="xo-cell" onclick="playXOMove(2)"></div>
                        <div class="xo-cell" onclick="playXOMove(3)"></div>
                        <div class="xo-cell" onclick="playXOMove(4)"></div>
                        <div class="xo-cell" onclick="playXOMove(5)"></div>
                        <div class="xo-cell" onclick="playXOMove(6)"></div>
                        <div class="xo-cell" onclick="playXOMove(7)"></div>
                        <div class="xo-cell" onclick="playXOMove(8)"></div>
                    </div>
                </div>
            </div>
        </div>

        <div class="status-box">
            <span id="statusText">Status: Disconnected</span>
            <span id="liveClock" style="color: #38bdf8; font-weight: bold; font-size: 14px;">12:00:00 AM</span>
        </div>

        <button id="connectBtn" class="btn btn-connect">Connect BLE</button>
        <button id="syncTimeBtn" class="btn btn-sync" disabled>Sync Phone Time (12H)</button>

        <div class="section-title">Smart Notifications 🔔</div>
        <div class="text-effect-grid">
            <button class="btn-mood" onclick="sendNotification('WHATSAPP')">WhatsApp 💬</button>
            <button class="btn-mood" onclick="sendNotification('CALL')">Incoming Call 📞</button>
            <button class="btn-mood" onclick="sendNotification('BATTERY')">Low Battery 🪫</button>
        </div>

        <div class="section-title">Custom Text & Effects</div>
        <div style="display: flex; gap: 8px; margin-bottom: 8px;">
            <input type="text" id="customInputText" placeholder="Type message..." maxlength="20">
            <button class="btn-mood" style="background: #0284c7; color: white; padding: 0 15px;" onclick="sendCustomText()">Send</button>
        </div>
        
        <div class="text-effect-grid">
            <button class="btn-mood" onclick="setTextEffect('STATIC')">Static</button>
            <button class="btn-mood" onclick="setTextEffect('SCROLL')">Scroll ➡️</button>
            <button class="btn-mood" onclick="setTextEffect('SLIDE')">Slide ⬇️</button>
        </div>

        <div class="section-title">Manual Time Setup (12H)</div>
        <div class="time-manual-box">
            <select id="selHour">
                <option value="01">01</option><option value="02">02</option><option value="03">03</option><option value="04">04</option><option value="05">05</option><option value="06">06</option><option value="07">07</option><option value="08">08</option><option value="09">09</option><option value="10">10</option><option value="11">11</option><option value="12">12</option>
            </select>
            <select id="selMin">
                <script>
                    for(let i=0; i<60; i++) {
                        let val = i < 10 ? '0' + i : i;
                        document.write(`<option value="${val}">${val}</option>`);
                    }
                </script>
            </select>
            <select id="selAmPm">
                <option value="AM">AM</option>
                <option value="PM">PM</option>
            </select>
        </div>
        <button id="sendManualTimeBtn" class="btn btn-mood" style="background: #0284c7; color: #fff; width: 100%; margin-bottom: 10px;" disabled>Send Manual Time</button>

        <div class="section-title">Expressions & Moods</div>
        <div class="mood-grid">
            <button class="btn-mood" onclick="setMood('NORMAL')">Normal</button>
            <button class="btn-mood" onclick="setMood('HAPPY')">Happy 😄</button>
            <button class="btn-mood" onclick="setMood('ANGRY')">Angry 😠</button>
            <button class="btn-mood" onclick="setMood('SLEEPY')">Sleepy 😴</button>
            <button class="btn-mood" onclick="setMood('WINK')">Wink 😉</button>
            <button class="btn-mood" onclick="setMood('SURPRISE')">Surprise 😲</button>
            <button class="btn-mood" onclick="setMood('FEAR')">Fear 😨</button>
            <button class="btn-mood" onclick="setMood('LOVE')">Love ❤️</button>
            <button class="btn-mood" onclick="setMood('FOCUS')">Focus 🤔</button>
            <button class="btn-mood" onclick="setMood('DISGUST')">Disgust 😒</button>
            <button class="btn-mood" onclick="setMood('DEAD')" style="background: #7f1d1d; color: #fca5a5;">Dead ❌</button>
        </div>

        <div class="section-title">BLE Log</div>
        <div class="log-box" id="logBox">Ready to connect...</div>
    </div>

    <script>
        let bluetoothDevice;
        let timeCharacteristic;
        let currentMood = 'NORMAL';
        let currentDisplayMode = 'EYES';
        let winkTimeout;
        
        let xoGrid = ['', '', '', '', '', '', '', '', ''];
        let xoGameOver = false;
        let playerPiece = 'X';
        let botPiece = 'O';

        const SERVICE_UUID = "4fafc201-1fb5-459e-8fcc-c5c9c331914b";
        const CHARACTERISTIC_UUID = "beb5483e-36e1-4688-b7f5-ea07361b26a8";

        const connectBtn = document.getElementById('connectBtn');
        const syncTimeBtn = document.getElementById('syncTimeBtn');
        const sendManualTimeBtn = document.getElementById('sendManualTimeBtn');
        const statusText = document.getElementById('statusText');
        const liveClock = document.getElementById('liveClock');
        const logBox = document.getElementById('logBox');

        function log(msg) {
            logBox.innerHTML += `> ${msg}<br>`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        setInterval(() => {
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12; h = h ? h : 12;
            const strH = String(h).padStart(2, '0');
            
            liveClock.innerText = `${strH}:${m}:${s} ${ampm}`;
            document.getElementById('screenClockMain').innerText = `${strH}:${m}:${s}`;
        }, 1000);

        async function switchDisplayMode(mode) {
            currentDisplayMode = mode;
            const wrappers = ['eyesWrapper', 'clockWrapper', 'textWrapper', 'musicWrapper', 'gameWrapper'];
            const btns = ['modeEyesBtn', 'modeClockBtn', 'modeTextBtn', 'modeMusicBtn', 'modeGameBtn'];
            
            wrappers.forEach(w => document.getElementById(w).style.display = 'none');
            btns.forEach(b => document.getElementById(b).classList.remove('active'));

            if (mode === 'EYES') {
                document.getElementById('eyesWrapper').style.display = 'flex';
                document.getElementById('modeEyesBtn').classList.add('active');
            } else if (mode === 'CLOCK') {
                document.getElementById('clockWrapper').style.display = 'flex';
                document.getElementById('modeClockBtn').classList.add('active');
            } else if (mode === 'TEXT') {
                document.getElementById('textWrapper').style.display = 'flex';
                document.getElementById('modeTextBtn').classList.add('active');
            } else if (mode === 'MUSIC') {
                document.getElementById('musicWrapper').style.display = 'flex';
                document.getElementById('modeMusicBtn').classList.add('active');
            } else if (mode === 'GAME') {
                document.getElementById('gameWrapper').style.display = 'flex';
                document.getElementById('modeGameBtn').classList.add('active');
                resetXOGame(false);
                if (timeCharacteristic) {
                    await sendDataToBLE(`MODE:GAME`);
                }
                return;
            }

            if (timeCharacteristic) {
                await sendDataToBLE(`MODE:${mode}`);
            }
        }

        async function sendNotification(nType) {
            if (currentDisplayMode !== 'EYES') await switchDisplayMode('EYES');
            let mood = 'NORMAL';
            if (nType === 'WHATSAPP') mood = 'SURPRISE';
            else if (nType === 'CALL') mood = 'ANGRY';
            else if (nType === 'BATTERY') mood = 'SLEEPY';

            updatePreviewEyes(mood, 0);
            currentMood = mood;
            
            if (!timeCharacteristic) { log(`[Simulation] Notification: ${nType}`); return; }
            await sendDataToBLE(`NOTIFY:${nType}`);
        }

        function setPlayerPiece(piece) {
            playerPiece = piece;
            botPiece = (piece === 'X') ? 'O' : 'X';
            document.getElementById('btnX').classList.toggle('active', piece === 'X');
            document.getElementById('btnO').classList.toggle('active', piece === 'O');
            resetXOGame(true);
        }

        function checkXOWinner(b) {
            const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
            for (let w of wins) {
                if (b[w[0]] && b[w[0]] === b[w[1]] && b[w[1]] === b[w[2]]) return b[w[0]];
            }
            if (!b.includes('')) return 'D';
            return null;
        }

        function getBotMoveUI(b) {
            for (let i = 0; i < 9; i++) {
                if (!b[i]) { b[i] = botPiece; if (checkXOWinner(b) === botPiece) { b[i] = ''; return i; } b[i] = ''; }
            }
            for (let i = 0; i < 9; i++) {
                if (!b[i]) { b[i] = playerPiece; if (checkXOWinner(b) === playerPiece) { b[i] = ''; return i; } b[i] = ''; }
            }
            if (!b[4]) return 4;
            let empty = b.map((v, i) => v === '' ? i : null).filter(v => v !== null);
            return empty.length ? empty[Math.floor(Math.random() * empty.length)] : -1;
        }

        function renderXOBoard() {
            const cells = document.querySelectorAll('.xo-cell');
            cells.forEach((cell, idx) => { cell.innerText = xoGrid[idx]; });
        }

        async function playXOMove(idx) {
            if (xoGameOver || xoGrid[idx] !== '' || document.getElementById('xoStatusText').innerText !== "Your Turn") return;

            xoGrid[idx] = playerPiece;
            renderXOBoard();

            let res = checkXOWinner(xoGrid);
            if (res === playerPiece) { 
                document.getElementById('xoStatusText').innerText = "You Win! 🎉"; 
                xoGameOver = true; 
                setMood('DEAD'); 
                if (timeCharacteristic) await sendDataToBLE(`RESULT:WIN`);
                return; 
            }
            if (res === 'D') { 
                document.getElementById('xoStatusText').innerText = "Draw! 🤝"; 
                xoGameOver = true; 
                setMood('NORMAL');
                if (timeCharacteristic) await sendDataToBLE(`RESULT:DRAW`);
                return; 
            }

            document.getElementById('xoStatusText').innerText = "Bot Think...";

            setTimeout(async () => {
                let botIdx = getBotMoveUI([...xoGrid]);
                if (botIdx !== -1) {
                    xoGrid[botIdx] = botPiece;
                    renderXOBoard();
                    res = checkXOWinner(xoGrid);
                    
                    if (res === botPiece) { 
                        document.getElementById('xoStatusText').innerText = "Bot Wins! 🤖"; 
                        xoGameOver = true; 
                        setMood('HAPPY'); 
                        if (timeCharacteristic) await sendDataToBLE(`RESULT:BOT`);
                    } else if (res === 'D') { 
                        document.getElementById('xoStatusText').innerText = "Draw! 🤝"; 
                        xoGameOver = true; 
                        setMood('NORMAL');
                        if (timeCharacteristic) await sendDataToBLE(`RESULT:DRAW`);
                    } else {
                        document.getElementById('xoStatusText').innerText = "Your Turn"; 
                    }
                }
            }, 600);
        }

        async function resetXOGame(sendBle = true) {
            xoGrid = ['', '', '', '', '', '', '', '', ''];
            xoGameOver = false;
            document.getElementById('xoStatusText').innerText = "Your Turn";
            
            if (playerPiece === 'O') {
                xoGrid[4] = botPiece;
            }
            
            renderXOBoard();
            setMood('NORMAL');
            if (sendBle && timeCharacteristic) await sendDataToBLE(`MOOD:NORMAL`);
        }

        async function sendCustomText() {
            const txt = document.getElementById('customInputText').value.trim();
            if (!txt) return;
            document.getElementById('screenTextDisplay').innerText = txt;
            await switchDisplayMode('TEXT');
            if (!timeCharacteristic) { log(`[Simulation] Text: ${txt}`); return; }
            await sendDataToBLE(`TEXT:${txt}`);
        }

        async function setTextEffect(effectName) {
            const txtElem = document.getElementById('screenTextDisplay');
            txtElem.className = "text-main";
            if (effectName === 'SCROLL') txtElem.classList.add('anim-scroll');
            else if (effectName === 'STATIC') txtElem.classList.add('anim-static');
            else if (effectName === 'SLIDE') txtElem.classList.add('anim-slide-down');
            if (!timeCharacteristic) { log(`[Simulation] Effect: ${effectName}`); return; }
            await sendDataToBLE(`FX:${effectName}`);
        }

        connectBtn.addEventListener('click', async () => {
            try {
                statusText.innerText = "Status: Scanning...";
                log("Requesting Bluetooth Device...");
                bluetoothDevice = await navigator.bluetooth.requestDevice({
                    filters: [{ name: 'RoboEyes_KeyChain' }],
                    optionalServices: [SERVICE_UUID]
                });
                log(`Device selected: ${bluetoothDevice.name}`);
                const server = await bluetoothDevice.gatt.connect();
                const service = await server.getPrimaryService(SERVICE_UUID);
                timeCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

                statusText.innerText = "Status: Connected 🟢";
                connectBtn.innerText = "Connected";
                connectBtn.classList.add('connected');
                syncTimeBtn.disabled = false;
                sendManualTimeBtn.disabled = false;
                log("Connected successfully.");

                bluetoothDevice.addEventListener('gattserverdisconnected', () => {
                    statusText.innerText = "Status: Disconnected 🔴";
                    connectBtn.innerText = "Connect BLE";
                    connectBtn.classList.remove('connected');
                    syncTimeBtn.disabled = true;
                    sendManualTimeBtn.disabled = true;
                    log("Bluetooth disconnected.");
                });
            } catch (error) {
                statusText.innerText = "Status: Failed or Canceled";
                log(`Error: ${error.message}`);
            }
        });

        syncTimeBtn.addEventListener('click', async () => {
            if (!timeCharacteristic) return;
            const now = new Date();
            let h = now.getHours();
            const m = String(now.getMinutes()).padStart(2, '0');
            const s = String(now.getSeconds()).padStart(2, '0');
            const ampm = h >= 12 ? 'PM' : 'AM';
            h = h % 12; h = h ? h : 12;
            await sendDataToBLE(`TIME:${String(h).padStart(2, '0')}:${m}:${s} ${ampm}`);
        });

        sendManualTimeBtn.addEventListener('click', async () => {
            if (!timeCharacteristic) return;
            const h = document.getElementById('selHour').value;
            const m = document.getElementById('selMin').value;
            const ampm = document.getElementById('selAmPm').value;
            await sendDataToBLE(`TIME:${h}:${m}:00 ${ampm}`);
        });

        async function setMood(moodName) {
            if (currentDisplayMode !== 'EYES' && currentDisplayMode !== 'GAME') await switchDisplayMode('EYES');
            currentMood = moodName;
            updatePreviewEyes(moodName, 0);

            if (moodName === 'WINK') {
                clearTimeout(winkTimeout);
                winkTimeout = setTimeout(() => { currentMood = 'NORMAL'; updatePreviewEyes('NORMAL', 0); }, 600);
            }
            if (!timeCharacteristic) { log(`[Simulation] Mood: ${moodName}`); return; }
            await sendDataToBLE(`MOOD:${moodName}`);
        }

        async function sendDataToBLE(dataString) {
            try {
                const encoder = new TextEncoder();
                await timeCharacteristic.writeValue(encoder.encode(dataString));
                log(`Data sent: ${dataString}`);
            } catch (error) {
                log(`Send failed: ${error.message}`);
            }
        }

        let randomOffsetX = 0, isBlinkingPreview = false;
        setInterval(() => {
            if (currentDisplayMode !== 'EYES' && currentDisplayMode !== 'GAME') return;
            if (Math.random() > 0.6 && currentMood !== 'WINK' && currentMood !== 'DEAD') {
                const choices = [-8, 0, 8, 0, -4, 4];
                randomOffsetX = choices[Math.floor(Math.random() * choices.length)];
            }
            if (Math.random() > 0.85 && currentMood !== 'WINK' && currentMood !== 'DEAD') {
                isBlinkingPreview = true;
                setTimeout(() => { isBlinkingPreview = false; }, 150);
            }
            updatePreviewEyes(currentMood, randomOffsetX);
        }, 800);

        function updatePreviewEyes(mood, offsetX) {
            const leftContainer = document.getElementById('leftContainer');
            const rightContainer = document.getElementById('rightContainer');
            const leftEye = document.getElementById('leftEye');
            const rightEye = document.getElementById('rightEye');
            const leftPupil = document.getElementById('leftPupil');
            const rightPupil = document.getElementById('rightPupil');
            const lBrow = document.getElementById('leftBrow');
            const rBrow = document.getElementById('rightBrow');
            const smileMouth = document.getElementById('smileMouth');
            
            leftContainer.style.transform = `translateX(${offsetX}px)`;
            rightContainer.style.transform = `translateX(${offsetX}px)`;

            leftEye.className = "eye-circle"; rightEye.className = "eye-circle";
            leftPupil.style.display = "block"; rightPupil.style.display = "block";
            leftEye.style.transform = "translateY(0px) scale(1)"; rightEye.style.transform = "translateY(0px) scale(1)";
            leftEye.style.height = "40px"; rightEye.style.height = "40px";
            leftEye.style.width = "40px"; rightEye.style.width = "40px";
            lBrow.style.transform = "translateY(0px) rotate(0deg)"; rBrow.style.transform = "translateY(0px) rotate(0deg)";
            lBrow.style.display = "block"; rBrow.style.display = "block";
            smileMouth.style.display = "none";

            if (isBlinkingPreview || mood === 'SLEEPY') {
                leftEye.style.height = "8px"; rightEye.style.height = "8px";
                leftPupil.style.display = "none"; rightPupil.style.display = "none";
                leftEye.style.transform = "translateY(16px)"; rightEye.style.transform = "translateY(16px)";
                lBrow.style.transform = "translateY(14px)"; rBrow.style.transform = "translateY(14px)";
                return;
            }
            if (mood === 'HAPPY') {
                leftPupil.style.display = "block"; rightPupil.style.display = "block";
                lBrow.style.transform = "translateY(6px)"; rBrow.style.transform = "translateY(6px)";
                smileMouth.style.display = "block";
            } else if (mood === 'WINK') {
                rightEye.style.height = "8px"; rightPupil.style.display = "none";
                rightEye.style.transform = "translateY(16px)"; rBrow.style.transform = "translateY(14px)";
            } else if (mood === 'ANGRY') {
                lBrow.style.transform = "translateY(4px) rotate(25deg)"; rBrow.style.transform = "translateY(4px) rotate(-25deg)";
            } else if (mood === 'SURPRISE') {
                leftEye.style.transform = "scale(1.2)"; rightEye.style.transform = "scale(1.2)";
                lBrow.style.transform = "translateY(-5px)"; rBrow.style.transform = "translateY(-5px)";
            } else if (mood === 'FEAR') {
                leftEye.style.width = "30px"; leftEye.style.height = "30px";
                rightEye.style.width = "30px"; rightEye.style.height = "30px";
            } else if (mood === 'LOVE') {
                leftEye.className = "eye-circle heart-eye"; rightEye.className = "eye-circle heart-eye";
                leftPupil.style.display = "none"; rightPupil.style.display = "none";
                lBrow.style.display = "none"; rBrow.style.display = "none";
            } else if (mood === 'FOCUS') {
                leftEye.style.height = "18px"; rightEye.style.height = "18px";
                leftPupil.style.display = "none"; rightPupil.style.display = "none";
                lBrow.style.transform = "translateY(10px) rotate(-15deg)"; rBrow.style.transform = "translateY(10px) rotate(15deg)";
            } else if (mood === 'DISGUST') {
                leftEye.style.height = "20px"; rightEye.style.height = "40px";
            } else if (mood === 'DEAD') {
                leftEye.className = "eye-circle dead-eye"; rightEye.className = "eye-circle dead-eye";
                leftPupil.style.display = "none"; rightPupil.style.display = "none";
                lBrow.style.display = "none"; rBrow.style.display = "none";
            }
        }
    </script>
</body>
</html>
</html>
